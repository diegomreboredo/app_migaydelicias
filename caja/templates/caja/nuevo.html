{% extends "base.html" %}

{% block title %}
Nuevo movimiento
{% endblock %}

{% block content %}

<a href="{% url 'lista_caja' %}"
   class="btn btn-outline-secondary mb-3">

    <i class="bi bi-arrow-left me-2"></i>

    Volver a Caja

</a>

<div class="card border-0 shadow-sm">

    <div class="card-body p-4">

        <h3 class="fw-bold mb-4">

            Nuevo movimiento de Caja

        </h3>

        <form method="post">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">

                    Tipo

                </label>

                {{ form.tipo }}

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Concepto

                </label>

                {{ form.concepto }}

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Monto

                </label>

                {{ form.monto }}

            </div>

            <div class="mb-4">

                <label class="form-label">

                    Observaciones

                </label>

                {{ form.observaciones }}

            </div>

            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-success">

                    <i class="bi bi-check-circle me-2"></i>

                    Guardar

                </button>

                <a href="{% url 'lista_caja' %}"
                   class="btn btn-outline-secondary">

                    Cancelar

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
