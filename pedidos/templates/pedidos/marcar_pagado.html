{% extends "base.html" %}

{% block title %}
Registrar pago
{% endblock %}

{% block content %}

<div class="card shadow-sm p-4">

    <h3 class="fw-bold mb-3">
        Registrar pago
    </h3>

    <p class="mb-4">
        <strong>Pedido #{{ pedido.numero }}</strong><br>
        Cliente: {{ pedido.cliente.nombre }}<br>
        Total: <strong>${{ pedido.total }}</strong>
    </p>

    <form method="post">

        {% csrf_token %}

        <div class="mb-4">

            {{ form.forma_pago.label_tag }}

            {{ form.forma_pago }}

        </div>

        <div class="d-flex gap-2">

            <button
                type="submit"
                class="btn btn-success">

                Confirmar pago

            </button>

            <a href="{% url 'detalle_pedido' pedido.id %}"
               class="btn btn-outline-secondary">

                Cancelar

            </a>

        </div>

    </form>

</div>

{% endblock %}
