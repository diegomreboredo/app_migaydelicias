{% extends "base.html" %}

{% block title %}
Cancelar compra
{% endblock %}

{% block content %}

<div class="card border-0 shadow-sm">

    <div class="card-body text-center p-5">

        <i class="bi bi-exclamation-triangle text-warning"
           style="font-size:4rem;"></i>

        <h2 class="mt-3">

            ¿Cancelar compra?

        </h2>

        <p class="text-muted">

            La compra
            <strong>#{{ compra.id }}</strong>
            pasará al estado
            <strong>Cancelada</strong>.

            <br><br>

            No se eliminará del sistema y podrá consultarse desde el historial.

        </p>

        <form method="post">

            {% csrf_token %}

            <a href="{% url 'detalle_compra' compra.id %}"
               class="btn btn-outline-secondary">

                Volver

            </a>

            <button
                type="submit"
                class="btn btn-warning">

                <i class="bi bi-x-circle me-2"></i>

                Confirmar cancelación

            </button>

        </form>

    </div>

</div>

{% endblock %}
