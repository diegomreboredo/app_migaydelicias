{% extends "base.html" %}

{% block title %}
Editar detalle
{% endblock %}

{% block content %}

<a href="{% url 'detalle_compra' detalle.compra.id %}"
   class="btn btn-outline-secondary mb-3">

    <i class="bi bi-arrow-left me-2"></i>

    Volver

</a>

<div class="card border-0 shadow-sm">

    <div class="card-body">

        <h3 class="fw-bold mb-4">

            Editar producto

        </h3>

        <form method="post">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">

                    Producto

                </label>

                {{ form.producto }}

            </div>

            <div class="mb-3">

                <label class="form-label">

                    Cantidad

                </label>

                {{ form.cantidad }}

            </div>

            <div class="mb-4">

                <label class="form-label">

                    Precio unitario

                </label>

                {{ form.precio_unitario }}

            </div>

            <button
                type="submit"
                class="btn btn-primary">

                <i class="bi bi-check-circle me-2"></i>

                Guardar cambios

            </button>

        </form>

    </div>

</div>

{% endblock %}
